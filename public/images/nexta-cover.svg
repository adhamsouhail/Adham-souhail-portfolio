  <rect x="260" y="280" width="56" height="56" rx="12" fill="#1A1F4E"/>
  <rect x="328" y="280" width="56" height="56" rx="12" fill="#F0B429"/>
  <rect x="396" y="280" width="56" height="56" rx="12" fill="#E8E8E8"/>
  <rect x="464" y="280" width="56" height="56" rx="12" fill="#F5F5F5" stroke="#DDDDDD" stroke-width="1"/>
  <!-- Typography sample -->
  <text x="260" y="382" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#999999" letter-spacing="2">TYPEFACE</text>
  <text x="260" y="410" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#1A1F4E">Aa Bb Cc 123</text>
  <!-- Category badge -->
  <rect x="260" y="440" width="140" height="32" rx="16" fill="#1A1F4E" fill-opacity="0.08"/>
  <text x="294" y="461" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1A1F4E">Brand Identity</text>
