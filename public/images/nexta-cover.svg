  <!-- Brand name -->
  <text x="360" y="178" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" fill="#1A1F4E">NEXTA</text>
  <!-- Tagline -->
  <text x="260" y="230" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#666666" letter-spacing="4">LOGISTICS · BRAND IDENTITY</text>
  <!-- Divider -->
  <rect x="260" y="256" width="280" height="2" fill="#1A1F4E" fill-opacity="0.15"/>
